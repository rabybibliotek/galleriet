<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR-Galleri enligt Z-planritning</title>
  
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
</head>
<body>

  <a-scene webxr="referenceSpaceType: local-floor">
    
    <!-- Ladda in alla 10 tavlor och golvtextur -->
    <a-assets>
      <img id="min-tavla1" src="images/bild1.png">
      <img id="min-tavla2" src="images/bild2.png">
      <img id="min-tavla3" src="images/bild3.png">
      <img id="min-tavla4" src="images/bild4.png">
      <img id="min-tavla5" src="images/bild5.png">
      <img id="min-tavla6" src="images/bild6.png">
      <img id="min-tavla7" src="images/bild7.png">
      <img id="min-tavla8" src="images/bild8.png">
      <img id="min-tavla9" src="images/bild9.png">
      <img id="min-tavla10" src="images/bild10.png">
      <img id="golv-textur" src="images/woodfloor.png">
    </a-assets>

    <!-- KAMERARIGG - Startar på Cirkel 1 (längst upp till vänster) -->
    <a-entity id="rig" position="0 0 -6" rotation="0 180 0">
      <a-camera position="0 1.6 0">
          <a-cursor 
              fuse="false" 
              raycaster="objects: .clickable" 
              material="color: black; shader: flat">
          </a-cursor>
      </a-camera>
    </a-entity>

    <!-- RUMMET OCH KORRIDORERNA -->
    <a-entity id="galleri">
      
      <!-- ============================================== -->
      <!-- GOLV OCH TAK (Täcker hela byggytan 12x18m)     -->
      <!-- ============================================== -->
      <a-plane position="4.5 0 1.5" rotation="-90 0 0" width="12" height="18" src="#golv-textur" repeat="12 18"></a-plane>
      <a-plane position="4.5 3 1.5" rotation="90 0 0" width="12" height="18" color="#FAFAFA"></a-plane>

      <!-- ============================================== -->
      <!-- VÄGGAR ENLIGT RITNING (Takhöjd 3m, Y-mitten 1.5) -->
      <!-- ============================================== -->
      
      <!-- VÄNSTRA KORRIDOREN -->
      <!-- Yttervägg Vänster -->
      <a-plane position="-1.5 1.5 -3" rotation="0 90 0" width="9" height="3" color="#F0F0F2"></a-plane>
      <!-- Toppvägg -->
      <a-plane position="0 1.5 -7.5" rotation="0 0 0" width="3" height="3" color="#F0F0F2"></a-plane>
      <!-- Innervägg (övre högra hörnet av vänstra korridoren) -->
      <a-plane position="1.5 1.5 -4.5" rotation="0 -90 0" width="6" height="3" color="#F0F0F2"></a-plane>

      <!-- MELLERSTA KORRIDOREN -->
      <!-- Toppvägg Mitten -->
      <a-plane position="6 1.5 -1.5" rotation="0 0 0" width="9" height="3" color="#F0F0F2"></a-plane>
      <!-- Bottenvägg Mitten -->
      <a-plane position="3 1.5 1.5" rotation="0 180 0" width="9" height="3" color="#F0F0F2"></a-plane>

      <!-- HÖGRA KORRIDOREN -->
      <!-- Yttervägg Höger -->
      <a-plane position="10.5 1.5 4.5" rotation="0 -90 0" width="12" height="3" color="#F0F0F2"></a-plane>
      <!-- Bottenvägg (längst ner) -->
      <a-plane position="9 1.5 10.5" rotation="0 180 0" width="3" height="3" color="#F0F0F2"></a-plane>
      <!-- Innervägg (nedre vänstra hörnet av högra korridoren) -->
      <a-plane position="7.5 1.5 6" rotation="0 90 0" width="9" height="3" color="#F0F0F2"></a-plane>


      <!-- ============================================== -->
      <!-- TAVLOR UPPhängda PÅ VÄGGARNA                   -->
      <!-- Z-värdet är 0.01 från väggen för att undvika flimmer -->
      <!-- ============================================== -->
      
      <!-- Tavla 1 & 2 på Vänstra ytterväggen (Faces East) -->
      <a-plane position="-1.49 1.5 -5" rotation="0 90 0" width="3" height="2" material="src: #min-tavla1"></a-plane>
      <a-plane position="-1.49 1.5 -1" rotation="0 90 0" width="3" height="2" material="src: #min-tavla2"></a-plane>

      <!-- Tavla 3 & 4 på Mellersta toppväggen (Faces South) -->
      <a-plane position="4 1.5 -1.49" rotation="0 0 0" width="1.5" height="2" material="src: #min-tavla3"></a-plane>
      <a-plane position="8 1.5 -1.49" rotation="0 0 0" width="1.5" height="2" material="src: #min-tavla4"></a-plane>

      <!-- Tavla 5, 6 & 7 på Högra ytterväggen (Faces West) -->
      <a-plane position="10.49 1.5 2" rotation="0 -90 0" width="1.5" height="2" material="src: #min-tavla5"></a-plane>
      <a-plane position="10.49 1.5 6" rotation="0 -90 0" width="3" height="2" material="src: #min-tavla6"></a-plane>
      <a-plane position="10.49 1.5 9" rotation="0 -90 0" width="1.5" height="2" material="src: #min-tavla7"></a-plane>

      <!-- Tavla 8 & 9 på Högra innerväggen (Faces East) -->
      <a-plane position="7.51 1.5 4" rotation="0 90 0" width="1.5" height="2" material="src: #min-tavla8"></a-plane>
      <a-plane position="7.51 1.5 8" rotation="0 90 0" width="3" height="2" material="src: #min-tavla9"></a-plane>

      <!-- Tavla 10 på Mellersta bottenväggen (Faces North) -->
      <a-plane position="3 1.5 1.49" rotation="0 180 0" width="1.5" height="2" material="src: #min-tavla10"></a-plane>


      <!-- ============================================== -->
      <!-- 9 TELEPORTERINGSCIRKLAR                        -->
      <!-- ============================================== -->
      
      <!-- Vänstra kolumnen -->
      <a-circle id="t1" class="clickable" position="0 0.01 -6" rotation="-90 0 0" radius="0.4" color="#111" animation__enter="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200" animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"></a-circle>
      <a-circle id="t2" class="clickable" position="0 0.01 -3" rotation="-90 0 0" radius="0.4" color="#111" animation__enter="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200" animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"></a-circle>
      <a-circle id="t3" class="clickable" position="0 0.01 0" rotation="-90 0 0" radius="0.4" color="#111" animation__enter="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200" animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"></a-circle>

      <!-- Mellersta raden -->
      <a-circle id="t4" class="clickable" position="3 0.01 0" rotation="-90 0 0" radius="0.4" color="#111" animation__enter="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200" animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"></a-circle>
      <a-circle id="t5" class="clickable" position="6 0.01 0" rotation="-90 0 0" radius="0.4" color="#111" animation__enter="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200" animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"></a-circle>
      <a-circle id="t6" class="clickable" position="9 0.01 0" rotation="-90 0 0" radius="0.4" color="#111" animation__enter="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200" animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"></a-circle>

      <!-- Högra kolumnen -->
      <a-circle id="t7" class="clickable" position="9 0.01 3" rotation="-90 0 0" radius="0.4" color="#111" animation__enter="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200" animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"></a-circle>
      <a-circle id="t8" class="clickable" position="9 0.01 6" rotation="-90 0 0" radius="0.4" color="#111" animation__enter="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200" animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"></a-circle>
      <a-circle id="t9" class="clickable" position="9 0.01 9" rotation="-90 0 0" radius="0.4" color="#111" animation__enter="property: scale; to: 1.1 1.1 1.1; startEvents: mouseenter; dur: 200" animation__leave="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 200"></a-circle>

      <!-- Omgivningsljus -->
      <a-light type="ambient" color="#BBB"></a-light>
    </a-entity>
  </a-scene>

  <!-- ============================================== -->
  <!-- JAVASCRIPT: Logik för att flytta kamerariggen  -->
  <!-- ============================================== -->
  <script>
    const rig = document.getElementById('rig');

    // Mappa ID till koordinater
    const teleporters = {
      't1': '0 0 -6',
      't2': '0 0 -3',
      't3': '0 0 0',
      't4': '3 0 0',
      't5': '6 0 0',
      't6': '9 0 0',
      't7': '9 0 3',
      't8': '9 0 6',
      't9': '9 0 9'
    };

    // Skapa en loop som går igenom alla cirklarna och ger dem en klickfunktion
    for (const [id, position] of Object.entries(teleporters)) {
      document.getElementById(id).addEventListener('click', function () {
        rig.setAttribute('position', position);
      });
    }
  </script>

</body>
</html>
